name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'pi-agent-mode-v') || startsWith(github.event.release.tag_name, 'pi-better-read-edit-v') || startsWith(github.event.release.tag_name, 'pi-btw-v') || startsWith(github.event.release.tag_name, 'pi-content-layout-v') || startsWith(github.event.release.tag_name, 'pi-double-paste-v') || startsWith(github.event.release.tag_name, 'pi-footer-minimal-v') || startsWith(github.event.release.tag_name, 'pi-inline-identifier-v') || startsWith(github.event.release.tag_name, 'pi-inline-skill-identifier-v') || startsWith(github.event.release.tag_name, 'pi-response-style-v') || startsWith(github.event.release.tag_name, 'pi-tool-call-markers-v') || startsWith(github.event.release.tag_name, 'pi-verbatim-compaction-v') || startsWith(github.event.release.tag_name, 'pi-welcome-screen-v') || startsWith(github.event.release.tag_name, 'pi-inline-agent-identifier-v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Resolve release package
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$RELEASE_TAG" in
            pi-agent-mode-v*)
              workspace="@pi-kaush/pi-agent-mode"
              directory="extensions/pi-agent-mode"
              prefix="pi-agent-mode-v"
              ;;
            pi-better-read-edit-v*)
              workspace="@pi-kaush/pi-better-read-edit"
              directory="extensions/pi-better-read-edit"
              prefix="pi-better-read-edit-v"
              ;;
            pi-content-layout-v*)
              workspace="@pi-kaush/pi-content-layout"
              directory="extensions/pi-content-layout"
              prefix="pi-content-layout-v"
              ;;
            pi-double-paste-v*)
              workspace="@pi-kaush/pi-double-paste"
              directory="extensions/pi-double-paste"
              prefix="pi-double-paste-v"
              ;;
            pi-footer-minimal-v*)
              workspace="@pi-kaush/pi-footer-minimal"
              directory="extensions/pi-footer-minimal"
              prefix="pi-footer-minimal-v"
              ;;
            pi-inline-agent-identifier-v*)
              workspace="@pi-kaush/pi-inline-agent-identifier"
              directory="extensions/pi-inline-agent-identifier"
              prefix="pi-inline-agent-identifier-v"
              ;;
            pi-inline-identifier-v*)
              workspace="@pi-kaush/pi-inline-identifier"
              directory="extensions/pi-inline-identifier"
              prefix="pi-inline-identifier-v"
              ;;
            pi-inline-skill-identifier-v*)
              workspace="@pi-kaush/pi-inline-skill-identifier"
              directory="extensions/pi-inline-skill-identifier"
              prefix="pi-inline-skill-identifier-v"
              ;;
            pi-verbatim-compaction-v*)
              workspace="@pi-kaush/pi-verbatim-compaction"
              directory="extensions/pi-verbatim-compaction"
              prefix="pi-verbatim-compaction-v"
              ;;
            pi-btw-v*)
              workspace="@pi-kaush/pi-btw"
              directory="extensions/pi-btw"
              prefix="pi-btw-v"
              ;;
            pi-response-style-v*)
              workspace="@pi-kaush/pi-response-style"
              directory="extensions/pi-response-style"
              prefix="pi-response-style-v"
              ;;
            pi-tool-call-markers-v*)
              workspace="@pi-kaush/pi-tool-call-markers"
              directory="extensions/pi-tool-call-markers"
              prefix="pi-tool-call-markers-v"
              ;;
            pi-welcome-screen-v*)
              workspace="@pi-kaush/pi-welcome-screen"
              directory="extensions/pi-welcome-screen"
              prefix="pi-welcome-screen-v"
              ;;
            *)
              echo "Unsupported release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

          release_version="${RELEASE_TAG#"$prefix"}"
          package_version="$(node -p "require('./$directory/package.json').version")"
          if [ "$release_version" != "$package_version" ]; then
            echo "Release $release_version does not match $workspace@$package_version" >&2
            exit 1
          fi

          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
      - run: npm publish --workspace "${{ steps.package.outputs.workspace }}" --access public --provenance
